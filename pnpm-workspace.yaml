packages:
  - apps/*
  - libs/*

catalog:
  "@types/node": ^26.6.4
  knip: ^6.40.0
  typescript: ~6.0.3
  valof: ^0.8.2
  vite-plus: 1.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowedVersions:
    vite: "*"
  allowAny:
    - vite

trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
minimumReleaseAge: 4320
minimumReleaseAgeExcludePrune: true
