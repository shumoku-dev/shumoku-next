packages:
  - apps/*
  - libs/*

catalog:
  '@types/node': ^26.6.5
  typescript: ~6.0.3
  vite-plus: 1.1.0
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0

overrides:
  vite@*: 'catalog:'

peerDependencyRules:
  allowAny:
    - vite

trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
minimumReleaseAgeExclude:
  - '@types/node@26.6.5'
