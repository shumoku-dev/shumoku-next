[tools]
node = "lts"
pnpm = "12"

[env]
# vp は mise では入れられないので、pnpm で入れた vite-plus の bin を PATH に足す。
# https://github.com/voidzero-dev/vite-plus/issues/943
_.path = ["node_modules/vite-plus/bin"]

[hooks]
postinstall = "mise lock --platform macos-arm64,macos-x64,linux-x64,linux-x64-musl,linux-arm64,linux-arm64-musl,windows-x64"
